[package]
name = "agent-os"
version = "0.1.0"
description = "A local workspace for your AI team"
authors = ["Agent OS contributors"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "agent_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-core = { path = "../crates/agent-core" }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["sync"] }
url = "2"
