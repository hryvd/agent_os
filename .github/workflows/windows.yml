name: Windows desktop

on:
  push:
    branches: [main, work]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Test and package Windows
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/agent-core -> target
            src-tauri -> target
      - name: Install frontend dependencies
        run: npm ci
      - name: Check core
        run: cargo test --locked --manifest-path crates/agent-core/Cargo.toml
      - name: Check frontend
        run: npm run build
      - name: Check desktop command boundary
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build installer
        run: npm run tauri -- build --ci --bundles nsis -- --locked
      - name: Save Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: agent-os-windows-x64
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30
